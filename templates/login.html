<!DOCTYPE html>
<html
<head>
    <title>Login</title>
</head> <style>
        body {
            background: #151b23;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: #222c38;
            width: 300px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #60a5fa;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3b82f6;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
<body>
    
    <div class="container">
    <h1>Welcome Back!</h1>
    <form action="/login" method="POST">

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <br><br>

        <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>

    </body>
</html>
